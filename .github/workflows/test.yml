name: Tests

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/test.yml"
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/test.yml"
      - "**.rs"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  msrv:
    name: Minimum supported Rust version ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: "1.81.0"
            features: fancy-diagnostics,chrono_0_4,time_0_3,jiff_0_1,jiff_0_2
            no_std_features: fancy-diagnostics
          - toolchain: "1.85.0"
            features: jiff_1
            no_std_features: fancy-diagnostics,jiff_1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve dependencies compatible with rust-version
        uses: dtolnay/rust-toolchain@stable

      # A recent Cargo resolves compatible transitive dependencies for the
      # declared MSRV; optional backends can otherwise select newer Rust APIs.
      - run: cargo generate-lockfile --config 'resolver.incompatible-rust-versions="fallback"'

      - name: Setup minimum Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          targets: thumbv7em-none-eabi

      - run: cargo test --locked --features=${{ matrix.features }}
      - run: cargo test --locked --no-default-features --features=${{ matrix.no_std_features }}
      - run: cargo check --locked --target=thumbv7em-none-eabi --no-default-features --features=${{ matrix.no_std_features }} --lib

  build:
    name: Test target ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - x86_64-apple-darwin
          - wasm32-wasip1
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: wasm32-wasip1
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}
          toolchain: stable

      - name: cargo build
        run: cargo build --target=${{ matrix.target }}

  docs:
    name: Doc Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Test
        run: cargo test --features=chrono_0_4 --doc

  test:
    name: Test feature ${{ matrix.feature }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - chrono_0_4
          - time_0_3
          - jiff_0_1
          - jiff_0_2
          - jiff_1
          - fancy-diagnostics

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Test
        run: cargo test --features=${{ matrix.feature }} --tests

      - name: Test diagnostics without default features
        if: matrix.feature == 'fancy-diagnostics'
        run: cargo test --no-default-features --features=fancy-diagnostics --tests
